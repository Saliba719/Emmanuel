<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cameroon ProfitKey — Quick Signals (XAF)</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#071018;
    --card:#0f1720;
    --muted:#9aa4b2;
    --accent1:#ff7a00;
    --accent2:#0cb86a;
    --blue:#1b57f2;
  }
  html,body{height:100%}
  body{
    margin:0; font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    background:
      radial-gradient(900px 400px at 10% -10%, rgba(27,87,242,.06), transparent),
      radial-gradient(900px 400px at 110% 10%, rgba(12,184,106,.04), transparent),
      var(--bg);
    color:#e6eef8; display:flex; align-items:center; justify-content:center; padding:28px;
  }
  .wrap{ width:min(680px, 96%); }
  .card{
    background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
    border:1px solid rgba(255,255,255,.04);
    border-radius:18px; padding:26px; box-shadow:0 18px 50px rgba(0,0,0,.6);
  }
  .flag{width:44px; display:block; margin:0 auto 8px}
  h1{ text-align:center; font-weight:800; font-size:22px; margin:6px 0 2px }
  .subtitle{ text-align:center; color:var(--muted); font-size:13px; margin-bottom:12px }
  .badges{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
  .badge{font-size:12px;color:#dfe9ff;background:#0b1620;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.03)}
  .games{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .game{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#0b1620;border:1px solid rgba(255,255,255,.03);cursor:pointer}
  .game input{accent-color:var(--accent2)}
  label.small{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
  .input{width:100%;background:#071522;border:1px solid rgba(255,255,255,.04);padding:12px 14px;border-radius:10px;color:#eaf6ff;font-family:ui-monospace,monospace}
  .note{font-size:12px;color:var(--muted);margin-top:8px;margin-bottom:12px;}
  .btn-start{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#071018;cursor:pointer;transition:transform 0.1s;}
  .btn-start:active{transform:scale(0.98);}
  .btn-deposit{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:0;background:linear-gradient(90deg,#2b9bff,#06b6d4);color:white;cursor:pointer;transition:transform 0.1s;}
  .btn-deposit:active{transform:scale(0.98);}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:13px}
  .footer{ text-align:center; color:#9aa4b2; font-size:12px; margin-top:12px }
  .countdown{font-weight:800;color:#fff; background:rgba(255,255,255,.03); padding:6px 10px;border-radius:8px}
  .disabled{opacity:.5;pointer-events:none}
  @media (max-width:520px){ .games{grid-template-columns:1fr} h1{font-size:20px} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="flag" src="https://flagcdn.com/w80/cm.png" alt="Cameroon flag" />
      <h1>Cameroon ProfitKey</h1>
      <div class="subtitle">Signaux Rapides • Conçu pour le Cameroon • FCFA</div>

      <div class="badges">
        <div class="badge">🔒 Sécurisé</div>
        <div class="badge">✅ Vérifié</div>
        <div class="badge">🇨🇲 Support Camerounais</div>
      </div>

      <div style="margin-bottom:8px;font-weight:700;color:#dbeeff">🎮 Choisissez votre jeu</div>
      <div class="games" id="games">
        <label class="game"><input type="radio" name="game" value="Crash" checked><span>💥 Crash</span></label>
        <label class="game"><input type="radio" name="game" value="Aviator"><span>✈️ Aviator</span></label>
        <label class="game"><input type="radio" name="game" value="Mines"><span>💎 Mines</span></label>
        <label class="game"><input type="radio" name="game" value="Chicken Road"><span>🐔 Chicken Road</span></label>
        <label class="game" style="grid-column:span 2"><input type="radio" name="game" value="Penalty"><span>⚽ Penalty</span></label>
    </div>

    <label class="small">ID du compte 1xBet</label>
    <input id="accId" class="input" placeholder="Entrez l'ID (ex: 1781234567)" inputmode="numeric" maxlength="10" />

    <div class="note">10 chiffres (début 178) • Devise: <strong>FCFA (XAF)</strong></div>

    <button id="startBtn" class="btn-start">Démarrer</button>

      <div style="height:10px"></div>

      <button id="depositBtn" class="btn-deposit">💳 Faire un Dépôt</button>

      <div class="meta" style="margin-top:12px">
        <div><span style="display:inline-block;width:8px;height:8px;background:#16a34a;border-radius:50%;margin-right:8px;"></span>En ligne: <span id="onlineCount">140</span></div>
        <div>L'accès se ferme dans <span id="countdown" class="countdown">04:00</span></div>
      </div>

      <div class="footer">Made by <strong>Hacker Cameroonais</strong> • Douala / Yaoundé</div>
    </div>
  </div>

  <!-- Встроенное модальное окно вместо alert() -->
  <div id="modalOverlay" class="fixed inset-0 flex items-center justify-center z-50 hidden" style="background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);">
    <div class="card" style="width: min(400px, 90%); text-align: center; padding: 24px;">
      <div id="modalText" style="margin-bottom: 20px; white-space: pre-wrap; line-height: 1.6; font-size: 15px; color: #e6eef8;"></div>
      <button id="modalCloseBtn" class="btn-start" style="padding: 12px;">Compris (OK)</button>
    </div>
  </div>

<script>
  // countdown 4 minutes
  let total = 4 * 60; // seconds
  const cdEl = document.getElementById('countdown');
  const startBtn = document.getElementById('startBtn');
  const depositBtn = document.getElementById('depositBtn');
  const accId = document.getElementById('accId');

  function fmt(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }
  cdEl.textContent = fmt(total);

  const timer = setInterval(()=>{
    total--;
    if(total < 0){
      clearInterval(timer);
      cdEl.textContent = "00:00";
      // disable actions when closed
      startBtn.classList.add('disabled');
      depositBtn.classList.add('disabled');
      startBtn.textContent = "Accès fermé";
      return;
    }
    cdEl.textContent = fmt(total);
  }, 1000);

  // validation ID: 10 chiffres, commence par 178
  function validId(v){
    return /^178\d{7}$/.test(v);
  }

  // Логика модального окна
  const modalOverlay = document.getElementById('modalOverlay');
  const modalText = document.getElementById('modalText');
  const modalCloseBtn = document.getElementById('modalCloseBtn');

  function showMessage(text) {
    modalText.textContent = text;
    modalOverlay.classList.remove('hidden');
  }

  modalCloseBtn.addEventListener('click', () => {
    modalOverlay.classList.add('hidden');
  });

  startBtn.addEventListener('click', ()=>{
    const v = accId.value.trim();
    if(!validId(v)){
      showMessage('⚠️ Veuillez entrer un ID de compte valide de 10 chiffres commençant par 178.');
      accId.focus();
      return;
    }
    // emulate unlocking flow
    const game = document.querySelector('input[name="game"]:checked').value;
    showMessage(`✅ Compte accepté !\n\n🎮 Jeu : ${game}\n🆔 ID : ${v}\n\nPromo code : BBL22\n\n⚠️ Pour continuer et recevoir le signal, vous devez faire un dépôt unique de 1200 FCFA.`);
  });

  depositBtn.addEventListener('click', ()=>{
    // change to your deposit link
    const link = 'https://refpa69905.com/L?tag=d_5160092m_64381c_bul&site=5160092&ad=64381&r=registration&type=phone'; 
    window.open(link, '_blank');
  });

  // small online counter demo
  setInterval(()=>{
    const el = document.getElementById('onlineCount');
    const cur = parseInt(el.textContent,10) || 80;
    const delta = Math.floor(Math.random()*3)-1; // -1..1
    el.textContent = Math.max(20, cur + delta);
  }, 2200);
</script>
</body>
</html>
